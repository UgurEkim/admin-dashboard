services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: repair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repair}
      POSTGRES_DB: repair_admin
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - repair_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repair -d repair_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  repair_postgres:
